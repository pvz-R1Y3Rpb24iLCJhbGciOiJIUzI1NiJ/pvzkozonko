<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Кто работал</title>
<style>
  body { font-family: monospace; font-size: 12px; margin: 8px; white-space: pre; }
  table { border-collapse: collapse; }
  td, th { padding: 1px 8px; text-align: left; border: none; }
  th { font-weight: bold; }
</style>
</head>
<body>
<div id="out">Загрузка...</div>

<!-- kz-core -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../core/kz.js" data-role="admin" data-page="lookup"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDgpd51erVNy_PwSbYTXPISALNMmYtgTN8",
    authDomain: "kozonko-9bff6.firebaseapp.com",
    databaseURL: "https://kozonko-9bff6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kozonko-9bff6",
    storageBucket: "kozonko-9bff6.appspot.com",
    messagingSenderId: "128059740430",
    appId: "1:128059740430:web:5c923c4e9d912be196c75f"
  };
  const fbApp = firebase.initializeApp(firebaseConfig);
  const db = firebase.database(fbApp);

  function fullNameOf(emp) {
    if (!emp) return '?';
    return (emp.fullName && emp.fullName.trim()) ? emp.fullName.trim() : emp.name;
  }

  function peopleForAssignment(ass, employeesById) {
    const people = [];
    if (!ass) return people;
    if (ass.employeeId && employeesById[ass.employeeId]) people.push(employeesById[ass.employeeId]);
    if (ass.second && ass.second.employeeId && employeesById[ass.second.employeeId]) people.push(employeesById[ass.second.employeeId]);
    return people;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(appData) {
    const out = document.getElementById('out');
    if (!appData) { out.textContent = 'НЕТ ДАННЫХ'; return; }

    const employeesById = {};
    (appData.employees || []).forEach(e => { employeesById[e.id] = e; });

    const order = (appData.order || []).filter(id => appData.tabs && appData.tabs[id]);
    const rows = [];

    order.forEach(id => {
      const tab = appData.tabs[id];
      if (!tab || !tab.monthData) return;
      Object.keys(tab.monthData).forEach(key => {
        const monthData = tab.monthData[key];
        if (!monthData || !monthData.assignments) return;
        Object.keys(monthData.assignments).forEach(dateVal => {
          const people = peopleForAssignment(monthData.assignments[dateVal], employeesById);
          if (people.length === 0) return;
          rows.push({ dateVal, pvz: tab.name || '?', names: people.map(fullNameOf).join(' + ') });
        });
      });
    });

    rows.sort((a, b) => a.dateVal < b.dateVal ? 1 : a.dateVal > b.dateVal ? -1 : a.pvz.localeCompare(b.pvz, 'ru'));

    if (rows.length === 0) { out.textContent = 'НЕТ СМЕН'; return; }

    let html = '<table><tr><th>ДАТА</th><th>ПВЗ</th><th>СОТРУДНИК</th></tr>';
    rows.forEach(r => {
      html += `<tr><td>${r.dateVal}</td><td>${escapeHtml(r.pvz)}</td><td>${escapeHtml(r.names)}</td></tr>`;
    });
    html += '</table>';
    out.innerHTML = html;
  }

  db.ref('appData').on('value', (snapshot) => {
    render(snapshot.val());
  }, (error) => {
    document.getElementById('out').textContent = 'ОШИБКА: ' + error.message;
  });
</script>
</body>
</html>
