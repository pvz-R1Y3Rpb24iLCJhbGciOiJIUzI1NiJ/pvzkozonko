<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Логи системы ПВЗ</title>
<!-- kz-core -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../core/kz.js" data-role="admin" data-page="logs"></script>
<style>
:root{--bg:#0F1115;--card:#1A1D24;--card2:#22262F;--border:#2A2E38;--t1:#E8EAED;--t2:#9AA0AA;--t3:#5F6570;--blue:#4D8BFF;--green:#34C759;--yellow:#FFB020;--red:#FF453A;--purple:#BF5AF2;--cyan:#32D7E0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);padding:20px;font-size:14px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--t3);font-size:12px;margin-bottom:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filt{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.filt.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{flex:1;min-width:200px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--t1);font-size:13px}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--t2)}
.stat b{font-size:18px;display:block;font-family:monospace;color:var(--t1)}
.log-group{margin-bottom:20px}
.group-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:8px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.log{display:grid;grid-template-columns:135px 90px 1fr;gap:12px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:start}
.log:hover{background:var(--card2)}
.log-time{color:var(--t3);font-family:monospace;font-size:11px}
.log-tag{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:6px;text-align:center;white-space:nowrap}
.tag-INFO{background:rgba(77,139,255,.15);color:var(--blue)}
.tag-NOTIF{background:rgba(191,90,242,.15);color:var(--purple)}
.tag-STATS{background:rgba(50,215,224,.15);color:var(--cyan)}
.tag-ERROR{background:rgba(255,69,58,.15);color:var(--red)}
.tag-WARN{background:rgba(255,176,32,.15);color:var(--yellow)}
.tag-SHIFT{background:rgba(52,199,89,.15);color:var(--green)}
.tag-SUPPLY{background:rgba(255,176,32,.15);color:var(--yellow)}
.tag-CHAT{background:rgba(77,139,255,.12);color:var(--cyan)}
.tag-AUDIT{background:rgba(255,69,58,.12);color:var(--red)}
.log-msg{color:var(--t1);word-break:break-word}
.log-who{color:var(--blue);font-weight:600}
.empty{text-align:center;padding:40px;color:var(--t3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 Логи системы ПВЗ</h1>
  <div class="sub">Все события: аудит смен, чаты, расходники, смены и статистика, боты, ошибки. Автоудаление старше 3000 строк.</div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="filt active" data-src="all" onclick="setFilter('all',this)">Все</button>
    <button class="filt" data-src="audit" onclick="setFilter('audit',this)">🔐 Аудит смен</button>
    <button class="filt" data-src="chat" onclick="setFilter('chat',this)">💬 Чаты</button>
    <button class="filt" data-src="supply" onclick="setFilter('supply',this)">📦 Расходники</button>
    <button class="filt" data-src="shift" onclick="setFilter('shift',this)">🔄 Смены и статистика</button>
    <button class="filt" data-src="bot" onclick="setFilter('bot',this)">🤖 Боты</button>
    <button class="filt" data-src="error" onclick="setFilter('error',this)">⚠️ Ошибки</button>
    <input class="search" id="search" placeholder="🔍 Поиск…" oninput="render()">
    <button class="filt" onclick="loadLogs()" title="Обновить логи">↻ Обновить</button>
  </div>
  <div id="logs"></div>
</div>
<script>
const cfg={apiKey:"AIzaSyDgpd51erVNy_PwSbYTXPISALNMmYtgTN8",authDomain:"kozonko-9bff6.firebaseapp.com",databaseURL:"https://kozonko-9bff6-default-rtdb.europe-west1.firebasedatabase.app",projectId:"kozonko-9bff6"};
firebase.initializeApp(cfg);
const db=firebase.database();
let allLogs=[],curFilter='all';

const GROUPS={
  audit:  {label:'🔐 Аудит открытия/закрытия смен', order:1},
  chat:   {label:'💬 Сообщения в чатах', order:2},
  supply: {label:'📦 Расходники',         order:3},
  shift:  {label:'🔄 Смены и статистика приёмки', order:4},
  bot:    {label:'🤖 Боты (статусы, работа)', order:5},
  error:  {label:'⚠️ Ошибки и предупреждения', order:6},
};

function classify(log){
  const lvl=(log.level||log.type||'').toUpperCase();
  const src=(log.source||'').toLowerCase();
  const msg=(log.msg||'').toLowerCase();
  if(src==='audit')return 'audit';
  if(lvl==='ERROR'||lvl==='WARN')return 'error';
  // Chat messages
  if(src.includes('chat')||src.includes('чат')||src.includes('message')||log.is_chat)return 'chat';
  // Supplies
  if(src.includes('supply')||src.includes('расход')||src.includes('zavhoz')||src.includes('inventory')||log.changes||msg.includes('расходник'))return 'supply';
  // Shifts and stats
  if(src.includes('shift')||src.includes('смен')||src.includes('jobparc')||src.includes('open')||src.includes('close')||src.includes('stats')||src.includes('приём')||msg.includes('смена')||msg.includes('приёмк'))return 'shift';
  // Bot status
  if(src.includes('bot')||src.includes('бот')||lvl==='INFO')return 'bot';
  return 'bot';
}

// ОПТИМИЗАЦИЯ: убрали setInterval с 15с поллингом.
// Теперь: один раз грузим limitToLast(300), потом слушаем только /logs для новых записей.
// limitToLast(3000) на 5 путей каждые 15с = ~1.1MB/мин → после фикса ~разовая загрузка.
let _logsLoaded=false;
// /system_logs — общий журнал бота (src:'bot') и панели сотрудника (src:'panel'). Индекс 5, остальные не трогаем.
const SOURCES=['/logs','/supplies/edit_log','/bot_logs','/jobparc_logs','/supplies/shift_audit_log','/system_logs'];
let loadedKeys=new Set(); // "path|key" уже показанных записей — защита от дублей в realtime-потоке

// Разбор одной записи Firebase (строка или объект) в единый формат лога.
// Вынесено в отдельную функцию, чтобы использовать и при первой загрузке,
// и при мгновенном добавлении новых записей через realtime-listener.
function buildEntry(k, e, si){
  // /logs entries are PLAIN STRINGS (control_logs / bot console output)
  if(typeof e==='string'){
    const ts=parseInt(k)||0;
    const low=e.toLowerCase();
    let src='bot';
    // Explicit bot tags first
    if(low.includes('[supplies_bot]')||low.includes('[botzavhoz]'))src='supply';
    else if(low.includes('[jobparc]')||low.includes('[web]'))src='shift';
    // Then content-based
    else if(low.includes('сообщение')||low.includes('написал')||low.includes('chat')||low.includes('чат'))src='chat';
    else if(low.includes('смена')||low.includes('приёмк')||low.includes('открыл')||low.includes('закрыл')||low.includes('график'))src='shift';
    else if(low.includes('расходник')||low.includes('заявк')||low.includes('заказ')||low.includes('остаток'))src='supply';
    return {
      ts, source:src, who:'', level: low.includes('ошибк')||low.includes('error')?'ERROR':'INFO',
      msg:e, is_chat:src==='chat', changes:null
    };
  }
  if(typeof e!=='object'||!e)return null;
  const ts=e.ts||e.timestamp||parseInt(k)||0;
  // /supplies/shift_audit_log — кто/откуда открыл или закрыл смену (см. supplies_staff_2col.html)
  if(si===4){
    const act=e.action==='open'?'Открытие':(e.action==='close'?'Закрытие':(e.action||'?'));
    return {
      ts: e.ts||parseInt(k)||0,
      source:'audit',
      who: e.username||'',
      level:'INFO',
      msg: `${act} смены · ${e.pvz_name||e.pvz_id||'?'} · время ${e.time||'?'} · IP ${e.ip||'unknown'}`,
      is_chat:false,
      changes:null
    };
  }
  // /system_logs — {src, msk, msg, data}; ключ = "{ts}_{суффикс}", время берём из ключа
  if(si===5){
    const m=String(e.msg||'');
    const low=m.toLowerCase();
    const extra=(e.data!==undefined&&e.data!==null)?' · '+JSON.stringify(e.data):'';
    const isPanel=e.src==='panel';
    let level='INFO';
    if(low.includes('ошибк')||low.includes('error')||low.includes('пропал'))level='ERROR';
    else if(low.includes('[write]')||low.includes('перезаписан'))level='STATS';
    return {
      ts: parseInt(k)||0,
      source: isPanel?'shift':'bot',
      who: isPanel?'панель':'бот',
      level,
      msg: m+extra+(e.pvz?` · ПВЗ ${e.pvz}`:''),
      is_chat:false,
      changes:null
    };
  }
  let msg=e.message||e.msg||e.text||'';
  if(e.changes){
    const ch=Array.isArray(e.changes)?e.changes.map(c=>`${c.name}: ${({ok:'Много',warn:'Мало',low:'Нет'})[c.status]||c.status||c.qty}`).join(', '):'';
    msg=`Изменены расходники: ${ch}`;
  }
  return {
    ts: typeof ts==='number'?ts:(Date.parse(ts)||0),
    source: e.source||(si===2?'supply':''),
    who: e.who||e.username||e.pvz_name||e.emp_name||'',
    level: e.level||e.type||'INFO',
    msg: msg||JSON.stringify(e).slice(0,200),
    is_chat: e.is_chat||false,
    changes: e.changes||null
  };
}

function loadLogs(){
  // Грузим только последние 300 записей из каждого (не 3000)
  Promise.all(SOURCES.map(p=>db.ref(p).limitToLast(300).get().catch(()=>null))).then(snaps=>{
    allLogs=[];
    loadedKeys=new Set();
    snaps.forEach((snap,si)=>{
      if(!snap||!snap.val())return;
      Object.entries(snap.val()).forEach(([k,e])=>{
        const entry=buildEntry(k,e,si);
        if(!entry)return;
        loadedKeys.add(SOURCES[si]+'|'+k);
        allLogs.push(entry);
      });
    });
    allLogs.sort((a,b)=>b.ts-a.ts);
    if(allLogs.length>3000)allLogs=allLogs.slice(0,3000);
    _logsLoaded=true;
    render(); renderStats();
    attachLiveListeners();
  });
}

function renderStats(){
  const counts={audit:0,chat:0,supply:0,shift:0,bot:0,error:0};
  allLogs.forEach(l=>{counts[classify(l)]++;});
  document.getElementById('stats').innerHTML=
    `<div class="stat">Всего<b>${allLogs.length}</b></div>`+
    Object.entries(GROUPS).map(([k,g])=>`<div class="stat">${g.label.split(' ')[0]} ${g.label.split(' ').slice(1).join(' ')}<b>${counts[k]}</b></div>`).join('');
}

function fmtTime(ts){
  if(!ts)return '—';
  return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function tagFor(l){
  const lvl=(l.level||'').toUpperCase();
  const cat=classify(l);
  if(cat==='audit')return 'AUDIT';
  if(cat==='chat')return 'CHAT';
  if(cat==='supply')return 'SUPPLY';
  if(cat==='shift')return 'SHIFT';
  if(['ERROR','WARN','NOTIF','STATS'].includes(lvl))return lvl;
  return 'INFO';
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let filtered=allLogs.filter(l=>{
    if(curFilter!=='all'&&classify(l)!==curFilter)return false;
    if(q&&!(l.msg+l.who+l.source).toLowerCase().includes(q))return false;
    return true;
  });
  const el=document.getElementById('logs');
  if(!filtered.length){el.innerHTML='<div class="empty">Нет записей</div>';return;}
  const groups={};
  filtered.forEach(l=>{const g=classify(l);(groups[g]=groups[g]||[]).push(l);});
  el.innerHTML=Object.keys(GROUPS).sort((a,b)=>GROUPS[a].order-GROUPS[b].order)
    .filter(g=>groups[g]?.length)
    .map(g=>`
    <div class="log-group">
      <div class="group-title">${GROUPS[g].label} <span style="color:var(--t3);font-weight:400">(${groups[g].length})</span></div>
      ${groups[g].slice(0,500).map(l=>`<div class="log">
        <span class="log-time">${fmtTime(l.ts)}</span>
        <span class="log-tag tag-${tagFor(l)}">${tagFor(l)}</span>
        <span class="log-msg">${l.who?`<span class="log-who">${esc(l.who)}</span> · `:''}${esc(l.msg)}</span>
      </div>`).join('')}
    </div>`).join('');
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
window.setFilter=function(f,btn){curFilter=f;document.querySelectorAll('.filt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();};

// ОПТИМИЗАЦИЯ: убрали автообновление каждые 15 секунд (это было 5×228KB каждые 15с)
// и убрали полную перезагрузку всех источников при появлении нового лога.
// Вместо этого — прямой realtime-listener на каждый из 4 источников:
// новая запись прилетает по проводу от Firebase и добавляется в таблицу
// мгновенно, без единого HTTP-запроса и без перезагрузки страницы.
// Кнопка "Обновить" остаётся для ручной полной пересинхронизации.
let _liveAttached=false;
function attachLiveListeners(){
  if(_liveAttached)return;
  _liveAttached=true;
  SOURCES.forEach((p,si)=>{
    db.ref(p).limitToLast(1).on('child_added', (snap)=>{
      const key=p+'|'+snap.key;
      if(loadedKeys.has(key))return; // это уже показанная запись (срабатывает при первом attach)
      loadedKeys.add(key);
      const entry=buildEntry(snap.key, snap.val(), si);
      if(!entry)return;
      allLogs.unshift(entry);
      if(allLogs.length>3000)allLogs.pop();
      render();
      renderStats();
    });
  });
}

loadLogs();
</script>
</body>
</html>
